# Builds the single-file overlay and attaches it to a GitHub Release.
# Trigger: push a version tag, e.g. `git tag v1.0.0 && git push origin v1.0.0`.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Rename artifact
        run: cp dist/index.html beat-saber-overlay.html

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" beat-saber-overlay.html \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
